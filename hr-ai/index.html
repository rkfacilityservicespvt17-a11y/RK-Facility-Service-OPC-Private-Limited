<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RK HR-AI Interview & Placement Assistant</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;
  background:#f4f7fb;color:#172033
}
header{
  background:linear-gradient(135deg,#123c69,#1769aa);
  color:white;padding:24px 16px;text-align:center
}
header h1{margin:0;font-size:25px}
header p{margin:8px 0 0}
main{max-width:800px;margin:auto;padding:16px}
.card{
  background:white;padding:20px;margin:15px 0;
  border-radius:16px;box-shadow:0 3px 15px #0001
}
label{font-weight:bold;display:block;margin:12px 0 6px}
select,textarea,input,button{
  width:100%;padding:13px;border-radius:10px;
  border:1px solid #ccd3dd;font-size:16px
}
button{
  background:#1769aa;color:white;border:0;
  font-weight:bold;margin-top:12px;cursor:pointer
}
button.secondary{background:#e8eef5;color:#172033}
button.green{background:#16834b}
.hidden{display:none}
.question{
  font-size:20px;font-weight:bold;line-height:1.5
}
.score{
  font-size:42px;font-weight:bold;text-align:center;
  color:#1769aa
}
.badge{
  display:inline-block;background:#e8f2ff;
  padding:8px 12px;border-radius:20px;margin:4px
}
footer{text-align:center;padding:25px;color:#667}
</style>
</head>
